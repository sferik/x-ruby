---
coverage_criteria:
  process_abort: true
fail_fast: true
includes:
- lib
integration:
  name: minitest
matcher:
  # x-core is loaded too, and is mutated in its own suite, so the classes x-uploads declares directly under X are named
  # one by one rather than matched by X*
  subjects:
  - X::Uploads*
  - X::UploadedMedia
  - X::AltTextFailed
  - X::ChunkedUploadFailed
  - X::InvalidMedia
  - X::InvalidMediaType
  - X::MediaProcessingCheckFailed
  - X::MediaProcessingFailed
  - X::MediaProcessingTimeout
  - X::MissingMediaData
mutation:
  operators: full
  timeout: 10.0
requires:
- x/uploads
usage: opensource
