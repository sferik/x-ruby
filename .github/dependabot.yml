version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  # The root, x-core, x-uploader, and x-objects each have a Gemfile and a bundle of their own
  - package-ecosystem: bundler
    directories:
      - /
      - /x-core
      - /x-uploader
      - /x-objects
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
