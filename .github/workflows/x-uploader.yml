name: x-uploader
on:
  push:
    # A tag names a commit whose push ran this workflow already, and a push of a tag skips the paths filter
    branches:
      - "**"
    paths:
      - "x-uploader/**"
      - "!x-uploader/**.md"
      - "x-core/lib/**"
      - "x-core/sig/*.rbs"
      - "x-core/x-core.gemspec"
      - "VERSION"
      - ".github/workflows/x-uploader.yml"
  pull_request:
    paths:
      - "x-uploader/**"
      - "!x-uploader/**.md"
      - "x-core/lib/**"
      - "x-core/sig/*.rbs"
      - "x-core/x-core.gemspec"
      - "VERSION"
      - ".github/workflows/x-uploader.yml"
defaults:
  run:
    working-directory: x-uploader
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # JRuby is left out: its line coverage misses lines it runs, such as an empty array literal, so the
        # suite cannot hold to the 100% floor there
        ruby: ["3.4", "4.0", "ruby-head"]
        include:
          - os: macos-latest
            ruby: "3.4"
          - os: windows-latest
            ruby: "3.4"
    runs-on: ${{ matrix.os }}
    # A head Ruby is informational: it reports a break before the release that carries it, without blocking a merge
    continue-on-error: ${{ endsWith(matrix.ruby, '-head') }}
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        working-directory: x-uploader
    - run: bundle exec rake test
  mutant:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true
        working-directory: x-uploader
    - run: bundle exec rake mutant
  steep:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true
        working-directory: x-uploader
    - run: bundle exec rake steep
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true
        working-directory: x-uploader
    - run: bundle exec rake yardstick
