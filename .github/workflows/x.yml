name: x
on:
  push:
    paths:
      - "lib/**"
      - "sig/**"
      - "test/**"
      - "Gemfile"
      - "Rakefile"
      - "Steepfile"
      - "x.gemspec"
      - "x-core/lib/**"
      - "x-core/sig/*.rbs"
      - "x-core/x-core.gemspec"
      - "x-uploader/lib/**"
      - "x-uploader/sig/*.rbs"
      - "x-uploader/x-uploader.gemspec"
      - "x-objects/lib/**"
      - "x-objects/sig/*.rbs"
      - "x-objects/x-objects.gemspec"
      - ".github/workflows/x.yml"
  pull_request:
    paths:
      - "lib/**"
      - "sig/**"
      - "test/**"
      - "Gemfile"
      - "Rakefile"
      - "Steepfile"
      - "x.gemspec"
      - "x-core/lib/**"
      - "x-core/sig/*.rbs"
      - "x-core/x-core.gemspec"
      - "x-uploader/lib/**"
      - "x-uploader/sig/*.rbs"
      - "x-uploader/x-uploader.gemspec"
      - "x-objects/lib/**"
      - "x-objects/sig/*.rbs"
      - "x-objects/x-objects.gemspec"
      - ".github/workflows/x.yml"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # JRuby is left out: its line coverage misses lines it runs, such as an empty array literal, so the
        # suite cannot hold to the 100% floor there
        ruby: ["3.4", "4.0", "ruby-head"]
        include:
          - os: macos-latest
            ruby: "3.4"
          - os: windows-latest
            ruby: "3.4"
    runs-on: ${{ matrix.os }}
    # A head Ruby is informational: it reports a break before the release that carries it, without blocking a merge
    continue-on-error: ${{ endsWith(matrix.ruby, '-head') }}
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake test:x
  steep:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true
    - run: bundle exec rake steep:x
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true
    - run: bundle exec rake yardstick:x
