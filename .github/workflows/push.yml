name: Push gem to RubyGems

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'sferik/x-ruby'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/x
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Update RubyGems
        run: gem update --system
      - name: Build gems
        run: bundle exec rake build
      - name: Sign, push, and await each gem in dependency order
        run: |
          for name in x-core x-objects x; do
            file=$(ls pkg/$name-[0-9]*.gem)
            gem exec sigstore-cli sign "$file" --bundle "pkg/$name.gem.sigstore.json"
            gem push "$file" --attestation "pkg/$name.gem.sigstore.json"
            gem exec rubygems-await "$file"
          done
