name: Push gem to RubyGems

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'sferik/x-ruby'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/x
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Update RubyGems
        run: gem update --system
      - name: Check that the tag and each gem version.rb hold the version in VERSION
        run: |
          version=$(cat VERSION)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not name the version in VERSION, $version"
            exit 1
          fi
          bundle exec rake check_versions
      - name: Build gems
        run: bundle exec rake build
      - name: Sign, push, and await each gem in dependency order
        run: |
          version=$(cat VERSION)
          for name in x-core x-uploader x-objects x; do
            file=pkg/$name-$version.gem
            # A rerun after a failed push skips the gems the failed run already published
            if curl --silent --fail --output /dev/null "https://rubygems.org/api/v2/rubygems/$name/versions/$version.json"; then
              echo "$name $version is already published"
              continue
            fi
            gem exec sigstore-cli sign "$file" --bundle "pkg/$name.gem.sigstore.json"
            gem push "$file" --attestation "pkg/$name.gem.sigstore.json"
            gem exec rubygems-await "$file"
          done
