name: linter
on:
  push:
    # A tag names a commit whose push ran this workflow already, and a push of a tag skips the paths filter
    branches:
      - "**"
    paths:
      - "**.rb"
      - "**.rbs"
      - "**/Gemfile"
      - "**/Rakefile"
      - "**/Steepfile"
      - "**.gemspec"
      - "**/sig/manifest.yaml"
      - "bin/**"
      - ".rubocop.yml"
      - "VERSION"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**.rb"
      - "**.rbs"
      - "**/Gemfile"
      - "**/Rakefile"
      - "**/Steepfile"
      - "**.gemspec"
      - "**/sig/manifest.yaml"
      - "bin/**"
      - ".rubocop.yml"
      - "VERSION"
      - ".github/workflows/lint.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true
    - run: bundle exec rake lint
  signatures:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true
    - run: bundle exec rake signatures
