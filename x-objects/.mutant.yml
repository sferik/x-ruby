---
coverage_criteria:
  process_abort: true
fail_fast: true
includes:
- lib
integration:
  name: minitest
matcher:
  # x-core is loaded too, and is mutated in its own suite, so the classes x-objects declares directly under X are named
  # one by one rather than matched by X*
  subjects:
  - X::Objects*
  - X::BookmarkFolder*
  - X::Community*
  - X::Cursor*
  - X::DirectMessage*
  - X::InvalidAttribute*
  - X::List*
  - X::MatchingRule*
  - X::Media*
  - X::MissingClient*
  - X::MissingResource*
  - X::Page*
  - X::PersonalizedTrend*
  - X::Place*
  - X::Poll*
  - X::Post*
  - X::Resource*
  - X::Space*
  - X::Trend*
  - X::Usage*
  - X::User*
mutation:
  operators: full
  timeout: 10.0
requires:
- x/objects
usage: opensource
