---
coverage_criteria:
  process_abort: true
fail_fast: true
includes:
- lib
integration:
  name: minitest
matcher:
  # X::Problem belongs to x-core, which x-objects requires the file of; its own suite mutates it
  ignore:
  - X::Problem*
  subjects:
  - X*
mutation:
  operators: full
  timeout: 10.0
requires:
- x/objects
usage: opensource
