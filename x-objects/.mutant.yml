---
coverage_criteria:
  process_abort: true
fail_fast: true
includes:
- lib
integration:
  name: minitest
matcher:
  # X::Problem and the errors follows? rescues belong to x-core, which x-objects requires the files of; its own
  # suite mutates them
  ignore:
  - X::Problem*
  - X::Core*
  - X::HTTPError*
  - X::ClientError*
  - X::Forbidden*
  - X::Unauthorized*
  subjects:
  - X*
mutation:
  operators: full
  timeout: 10.0
requires:
- x/objects
usage: opensource
