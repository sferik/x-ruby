---
coverage_criteria:
  process_abort: true
fail_fast: true
includes:
- lib
integration:
  name: minitest
matcher:
  # x-core is loaded too, and is mutated in its own suite, so the classes x-objects declares directly under X are named
  # one by one rather than matched by X*
  subjects:
  - X::Objects*
  - X::BookmarkFolder*
  - X::Community*
  - X::Cursor*
  - X::DirectMessage*
  - X::InvalidAttribute*
  - X::List*
  - X::MatchingRule*
  - X::Media*
  - X::MissingClient*
  - X::MissingResource*
  - X::Page*
  - X::PersonalizedTrend*
  - X::Place*
  - X::Poll*
  - X::Post*
  - X::Resource*
  - X::Space*
  - X::Trend*
  - X::PostUsage*
  - X::User*
  # Each class of resource makes X::Resource.from_id, which X::Resource keeps private, public on itself, which mutant
  # would match as a method of that class, but is the one X::Resource.from_id, which is mutated as such
  ignore:
  - X::BookmarkFolder.from_id
  - X::Community.from_id
  - X::DirectMessage.from_id
  - X::List.from_id
  - X::Place.from_id
  - X::Poll.from_id
  - X::Post.from_id
  - X::Space.from_id
  - X::User.from_id
mutation:
  operators: full
  timeout: 10.0
requires:
- x/objects
usage: opensource
